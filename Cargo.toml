[package]
name = "webstamp-addresses"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = "0.36.2"
fontdb = "0.24.0"
hayro = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lopdf = "0.45.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_Storage_Xps", "Win32_System_Memory", "Win32_Graphics_Printing", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
winresource = "0.1.31"
